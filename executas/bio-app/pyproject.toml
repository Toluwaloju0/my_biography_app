[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-bio-app"
version = "0.1.0"
description = "Executa for the bio-app Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-bio-app" = "bio_app_plugin:main"

[tool.setuptools]
py-modules = ["bio_app_plugin"]
